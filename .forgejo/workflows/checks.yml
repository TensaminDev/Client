      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Build mobile
        run: bun run build:mobile

  build-desktop:
    runs-on: docker
    steps:
