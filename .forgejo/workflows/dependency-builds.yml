name: Dependency builds

on:
  pull_request:

env:
  FORGEJO_TOKEN: ""
  GITHUB_TOKEN: ""

jobs:
  web:
    if: ${{ github.actor == 'rasensprenger' }}
    name: Build web
    runs-on: nixos
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - run: nix develop .#electron --command pnpm install --frozen-lockfile
      - run: nix develop .#electron --command pnpm run build:packages
      - run: nix develop .#electron --command pnpm run build:web

  desktop:
    if: ${{ github.actor == 'rasensprenger' }}
    name: Build desktop
    runs-on: nixos
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - run: nix develop .#electron --command pnpm install --frozen-lockfile
      - run: nix develop .#electron --command pnpm run build:packages
      - run: nix develop .#electron --command pnpm run build:desktop

  native-mtp:
    if: ${{ github.actor == 'rasensprenger' }}
    name: Test native MTP
    runs-on: nixos
    steps:
      - run: nix profile add nixpkgs#nodejs_24
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - name: Align Tauri git dependencies
        run: |
          manifest=apps/tauri/src-tauri/Cargo.toml
          build_revision=$(sed -nE 's/^tauri-build = .*rev = "([^"]+)".*/\1/p' "$manifest")
          patch_revision=$(sed -nE '/^\[patch.crates-io.tauri\]/,/^rev = / s/^rev = "([^"]+)"/\1/p' "$manifest")
          if [ "$build_revision" != "$patch_revision" ]; then
            sed -i "/^\[patch.crates-io.tauri\]/,/^rev = / s/^rev = \".*\"/rev = \"$build_revision\"/" "$manifest"
            nix develop .#tauri --command bash -lc 'cd apps/tauri/src-tauri && cargo update -p swift-rs'
          fi
      - run: nix develop .#tauri --command bash -lc 'cd apps/tauri/src-tauri && cargo test'

  mobile:
    if: ${{ github.actor == 'rasensprenger' }}
    name: Build mobile
    runs-on: nixos
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - name: Align Tauri git dependencies
        run: |
          manifest=apps/tauri/src-tauri/Cargo.toml
          build_revision=$(sed -nE 's/^tauri-build = .*rev = "([^"]+)".*/\1/p' "$manifest")
          patch_revision=$(sed -nE '/^\[patch.crates-io.tauri\]/,/^rev = / s/^rev = "([^"]+)"/\1/p' "$manifest")
          if [ "$build_revision" != "$patch_revision" ]; then
            sed -i "/^\[patch.crates-io.tauri\]/,/^rev = / s/^rev = \".*\"/rev = \"$build_revision\"/" "$manifest"
            nix develop .#tauri --command bash -lc 'cd apps/tauri/src-tauri && cargo update -p swift-rs'
          fi
      - run: nix develop .#tauri --command pnpm install --frozen-lockfile
      - run: nix develop .#tauri --command pnpm run build:packages
      - run: nix develop .#tauri --command pnpm --dir apps/tauri run build:mobile:ci
